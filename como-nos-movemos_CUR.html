<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia · Semana de la Movilidad Sostenible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta oficial IET (escala de teal) */
    --c100:#013039; /* 100% */
    --c80:#0c6c7d;  /* 80%  */
    --c60:#3d8997;  /* 60%  */
    --c40:#6da7b1;  /* 40%  */
    --c20:#9ec4cb;  /* 20%  */
    --c10:#cee2e5;  /* tinte más claro */

    --teal-dark:var(--c100);
    --teal:var(--c80);
    --teal-mid:var(--c60);
    --pill:var(--c10);
    --pill-text:var(--c100);
    --dim-text:#a6a6a6;
    --green:#00bf63;
    --red:#ff5757;
    --yellow:#f5e76e;
    --bg-top:var(--c40);
    --bg-bottom:#d9d9d9;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:clamp(12px,4vw,24px) clamp(10px,4vw,16px);
  }
  .app{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:clamp(10px,3vw,16px);
  }
  header{
    background:var(--teal);
    border-radius:16px;
    padding:clamp(10px,3vw,14px) clamp(12px,4vw,20px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(6px,2vw,12px);
    flex-wrap:nowrap;
  }
  header img.iet-logo{
    height:clamp(24px,7vw,38px);
    width:auto;
    display:block;
    flex-shrink:0;
  }
  header .title{
    color:#fff;
    font-weight:800;
    font-size:clamp(10px,3vw,14px);
    letter-spacing:.3px;
    text-align:center;
    line-height:1.25;
    flex:1;
    min-width:0;
  }
  header img.unr-logo{
    height:clamp(30px,8vw,52px);
    width:auto;
    display:block;
    flex-shrink:0;
  }
  .card{
    background:var(--teal);
    border-radius:18px;
    padding:clamp(16px,5vw,24px);
    color:#fff;
  }
  .eyebrow{
    font-weight:800;
    font-size:clamp(10px,2.8vw,12px);
    letter-spacing:.5px;
    opacity:.85;
    margin:0 0 10px;
    text-transform:uppercase;
  }
  .question{
    font-weight:800;
    font-size:clamp(16px,4.8vw,20px);
    line-height:1.3;
    margin:0 0 18px;
  }
  .question-img{
    display:block;
    width:100%;
    height:auto;
    border-radius:12px;
    margin:0 0 18px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    background:var(--pill);
    color:var(--pill-text);
    border:2px solid transparent;
    border-radius:14px;
    padding:clamp(12px,3.5vw,14px) clamp(14px,4vw,18px);
    font-weight:700;
    font-size:clamp(13px,3.6vw,15px);
    line-height:1.35;
    text-align:left;
    cursor:pointer;
    transition:transform .1s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .option:hover:not(:disabled){
    transform:translateY(-1px);
  }
  .option:disabled{
    cursor:default;
  }
  /* Opción marcada por el usuario (correcta o incorrecta): mismo resalte sólido */
  .option.selected{
    background:var(--teal-mid);
    color:#fff;
    border-color:#fff;
    font-weight:800;
  }
  /* Opción correcta cuando NO fue la elegida: se resalta en verde para que quede clara */
  .option.correct-hint{
    background:var(--green);
    color:#fff;
    border-color:#fff;
    font-weight:800;
  }
  /* Resto de opciones no elegidas */
  .option.dim{ color:var(--dim-text); }

  .feedback{
    border-radius:16px;
    padding:clamp(12px,3.5vw,14px) 20px;
    text-align:center;
    font-weight:800;
    font-size:clamp(13px,3.6vw,15px);
    color:#fff;
  }
  .feedback.correct{ background:var(--green); }
  .feedback.incorrect{ background:var(--red); }

  .fact{
    background:var(--teal-mid);
    border-radius:16px;
    padding:clamp(14px,4vw,18px) clamp(16px,4vw,20px);
    color:#fff;
  }
  .fact .label{
    font-weight:800;
    font-size:clamp(10px,2.8vw,12px);
    letter-spacing:.5px;
    opacity:.85;
    margin:0 0 8px;
  }
  .fact .text{
    font-weight:700;
    font-size:clamp(13px,3.6vw,15px);
    line-height:1.4;
    margin:0;
  }

  .next-btn{
    background:var(--teal-dark);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:clamp(13px,4vw,16px) 20px;
    font-weight:800;
    font-size:clamp(13px,3.6vw,15px);
    letter-spacing:.3px;
    cursor:pointer;
    width:100%;
  }
  .next-btn:hover{ background:#011f26; }

  .progress{
    text-align:center;
    color:var(--teal-dark);
    font-weight:700;
    font-size:clamp(11px,3vw,13px);
    letter-spacing:.3px;
  }

  /* Pantalla de registro */
  .reg-card{
    background:var(--teal);
    border-radius:18px;
    padding:clamp(20px,6vw,28px) clamp(16px,5vw,24px);
    color:#fff;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .reg-title{
    font-weight:800;
    font-size:clamp(16px,4.8vw,20px);
    line-height:1.3;
    margin:0;
  }
  .reg-subtitle{
    font-weight:600;
    font-size:clamp(12.5px,3.6vw,14px);
    line-height:1.4;
    margin:0;
    opacity:.9;
  }
  .reg-field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .reg-field label{
    font-weight:800;
    font-size:clamp(10px,2.8vw,12px);
    letter-spacing:.5px;
    text-transform:uppercase;
    opacity:.9;
  }
  .reg-field input{
    background:var(--pill);
    color:var(--pill-text);
    border:2px solid transparent;
    border-radius:14px;
    padding:clamp(12px,3.5vw,14px) clamp(14px,4vw,18px);
    font-weight:700;
    font-size:clamp(13px,3.6vw,15px);
    font-family:inherit;
  }
  .reg-field input:focus{
    outline:none;
    border-color:#fff;
  }
  .reg-field select{
    background:var(--pill);
    color:var(--pill-text);
    border:2px solid transparent;
    border-radius:14px;
    padding:clamp(12px,3.5vw,14px) clamp(14px,4vw,18px);
    font-weight:700;
    font-size:clamp(13px,3.6vw,15px);
    font-family:inherit;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%23013039' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right clamp(14px,4vw,18px) center;
    padding-right:clamp(36px,9vw,44px);
  }
  .reg-field select:focus{
    outline:none;
    border-color:#fff;
  }
  .reg-error{
    color:var(--yellow);
    font-weight:700;
    font-size:clamp(12px,3.4vw,13px);
    margin:0;
  }
  .start-btn{
    background:var(--teal-dark);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:clamp(13px,4vw,16px) 20px;
    font-weight:800;
    font-size:clamp(13px,3.6vw,15px);
    letter-spacing:.3px;
    cursor:pointer;
    width:100%;
  }
  .start-btn:hover{ background:#011f26; }

  /* Pantalla final */
  .final-card{
    background:var(--teal);
    border-radius:18px;
    padding:clamp(20px,6vw,28px) clamp(16px,5vw,24px);
    color:#fff;
  }
  .final-label{
    text-align:center;
    font-weight:800;
    font-size:clamp(11px,3vw,13px);
    letter-spacing:.5px;
    color:var(--yellow);
    margin:0 0 4px;
  }
  .final-score{
    text-align:center;
    font-weight:900;
    font-size:clamp(34px,11vw,52px);
    margin:0 0 20px;
  }
  .summary-title{
    font-weight:800;
    font-size:clamp(11px,3vw,13px);
    letter-spacing:.5px;
    margin:0 0 12px;
    opacity:.9;
  }
  .summary-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .summary-item{
    background:var(--pill);
    color:var(--pill-text);
    border-radius:14px;
    padding:clamp(12px,3.5vw,14px) clamp(14px,4vw,16px);
  }
  .summary-item .q{
    font-weight:800;
    font-size:clamp(12px,3.4vw,14px);
    margin:0 0 4px;
    display:flex;
    gap:8px;
    line-height:1.35;
  }
  .summary-item .mark{
    flex-shrink:0;
  }
  .summary-item .mark.ok{ color:#00944c; }
  .summary-item .mark.bad{ color:#e14343; }
  .summary-item .ans{
    font-size:clamp(11.5px,3.2vw,13px);
    font-weight:600;
    margin:0 0 4px;
    opacity:.85;
  }
  .summary-item .dato{
    font-size:clamp(11.5px,3.2vw,13px);
    font-weight:600;
    margin:0;
    opacity:.9;
  }
  .restart-btn{
    background:var(--teal-dark);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:clamp(13px,4vw,16px) 20px;
    font-weight:800;
    font-size:clamp(13px,3.6vw,15px);
    cursor:pointer;
    width:100%;
  }
  .restart-btn:hover{ background:#011f26; }

  .download-card{
    background:var(--teal-dark);
    border-radius:18px;
    padding:clamp(16px,5vw,20px) clamp(16px,5vw,22px);
    color:#fff;
    text-align:center;
  }
  .download-card p{
    margin:0 0 14px;
    font-weight:700;
    font-size:clamp(12.5px,3.6vw,14px);
    line-height:1.4;
  }
  .download-card a{
    display:inline-block;
    background:var(--yellow);
    color:var(--teal-dark);
    border-radius:14px;
    padding:12px 22px;
    font-weight:800;
    text-decoration:none;
    font-size:clamp(12.5px,3.6vw,14px);
  }
  .download-card a:hover{ opacity:.9; }

  .send-status{
    border-radius:16px;
    padding:clamp(12px,3.5vw,14px) 18px;
    text-align:center;
    font-weight:800;
    font-size:clamp(13px,3.6vw,15px);
    color:#fff;
  }
  .send-status.sending{ background:var(--teal-mid); }
  .send-status.success{ background:var(--green); }
  .send-status.error{ background:var(--red); }
  .send-status p{ margin:0 0 10px; }
  .retry-btn{
    background:#fff;
    color:var(--red);
    border:none;
    border-radius:12px;
    padding:8px 16px;
    font-weight:800;
    cursor:pointer;
  }

  html{ color-scheme: light; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUIZ_DATA = {"block1": [{"q": "¿Qué busca la movilidad sostenible?", "options": ["Que las personas puedan desplazarse de manera segura y eficiente, reduciendo los impactos de sus viajes.", "Que la mayoría de los desplazamientos se realicen en vehículos más chicos.", "Que se reduzca la cantidad de viajes que realizan las personas."], "correct": 0, "dato": "La movilidad sostenible no se refiere únicamente al cuidado del ambiente: también involucra aspectos como la seguridad vial, la accesibilidad, la eficiencia y el uso del espacio urbano."}, {"q": "¿A qué llamamos \"movilidad activa\"?", "options": ["A movernos usando nuestro propio cuerpo, como caminar o pedalear.", "La sincronización de los semáforos para agilizar el tránsito de los vehículos en las avenidas.", "El flujo sin interrupciones de vehículos de emergencia, como ambulancias y bomberos."], "correct": 0, "dato": "Fomentar la movilidad activa tiene un impacto ambiental nulo (no genera emisiones de gases ni ruido), optimiza el uso del espacio público y, además, aporta beneficios directos a la salud física de las personas."}, {"q": "¿Por qué el transporte público puede contribuir a una movilidad más sostenible?", "options": ["Porque traslada a muchas personas en un solo viaje y ocupa menos lugar en la calle.", "Porque sus trayectos son siempre más directos que los del auto.", "Porque no genera ningún impacto ambiental."], "correct": 0, "dato": null}, {"q": "En transporte, ¿qué significa hacer un viaje \"intermodal\"?", "options": ["Usar y combinar más de un modo de transporte en el mismo trayecto (por ejemplo, colectivo + caminata).", "La separación física mediante barreras de los distintos tipos de vehículos en una misma calle.", "Utilizar diferentes tipos de transporte según el día o el momento del viaje."], "correct": 0, "dato": "Un viaje intermodal típico ocurre cuando una persona camina hasta una parada, toma un colectivo y, al bajar, utiliza una bicicleta pública o camina para llegar a su destino final. Esto reduce drásticamente la dependencia del automóvil para distancias largas."}], "block2": [{"q": "¿En qué momento del día crees que entra más gente caminando al CUR?", "options": ["Entre las 7:00 h y las 8:00 h", "Entre las 8:00 h y las 9:00 h", "Entre las 12:00 h y las 13:00 h"], "correct": 1, "dato": "Entre las 8:00 h y las 9:00 h ingresaron aproximadamente 1.680 peatones, siendo el momento de mayor ingreso, registrado durante el relevamiento realizado el 20/05/2026 por el Instituto de Estudios de Transporte."}, {"q": "¿Cuántas líneas de colectivo llegan al CUR?", "options": ["9 líneas", "5 líneas", "12 líneas"], "correct": 0, "dato": "Entre esas 9 líneas se contaron 252 llegadas al CUR en apenas 3 horas y cuarto de observación, según el relevamiento realizado el 20/05/2026 por el Instituto de Estudios de Transporte."}, {"q": "¿Cuáles son las líneas de colectivo más elegidas para llegar?", "options": ["131/132", "115/115A", "101N"], "correct": 0, "dato": "Las líneas 131 y 132 transportan al 27% de los pasajeros de colectivos. Si sumamos la 115 y 115A tenemos casi el 50% de los pasajeros."}, {"q": "¿Por cuál de las entradas ingresa la mayor cantidad de gente a pie?", "options": ["Parada Segura", "Portón principal (Riobamba)", "Portón IMAE"], "correct": 0, "dato": "En el egreso el protagonismo se invierte: el acceso Riobamba llega a absorber entre el 85% y el 90% de las salidas, según el relevamiento realizado el 20/05/2026 por el Instituto de Estudios de Transporte."}, {"q": "¿En qué franja horaria consideras que entra la mayor cantidad de autos y motos al CUR?", "options": ["Durante la mañana", "Al mediodía", "Durante la tarde"], "correct": 0, "dato": "Entre las 07:30 y las 10:30 ingresan aproximadamente el 35% de los vehículos, según el relevamiento realizado el 20/05/2026 por el Instituto de Estudios de Transporte."}, {"q": "¿Cuál es el portón más usado por autos y motos para retirarse del predio?", "options": ["Portón principal (Riobamba)", "Portón IMAE", "Ambos tuvieron la misma cantidad"], "correct": 1, "dato": "El portón IMAE suma aproximadamente el 56% de las salidas vehiculares, según el relevamiento realizado el 20/05/2026 por el Instituto de Estudios de Transporte."}, {"q": "¿Cuál consideras que es la cantidad máxima de vehículos que hay dentro del CUR en un día típico?", "options": ["Entre 300 y 450", "Entre 450 y 650", "Más de 650"], "correct": 2, "dato": "Durante el relevamiento del IET el día 20 de mayo de 2026, el máximo registrado fue de 676 vehículos dentro del CUR, entre las 18:45 y las 19:15 h."}, {"q": "¿Qué porcentaje de los vehículos que ingresan se queda menos de 30 minutos dentro del CUR?", "options": ["Entre 15% y 25%", "Entre 25% y 35%", "Entre 35% y 45%"], "correct": 1, "dato": "El 27% de los vehículos ingresa al CUR por menos de 30 minutos. Estos viajes cortos se asocian principalmente con viajes de alcance, como dejar o buscar personas."}, {"q": "¿Cuánto tiempo suelen quedarse estacionados en promedio los autos?", "options": ["Aproximadamente 1h y media", "Aproximadamente 2h y media", "Más de 3h y media"], "correct": 1, "dato": "Sin contar los vehículos que realizan viajes de alcance, el 18% permanece entre 2 y 2,5 horas dentro del CUR."}, {"q": "¿A qué hora se ve más movimiento de autos que sólo entran a dejar o buscar a alguien?", "options": ["Entre las 07:30 y las 08:30h", "Entre las 12:30 y las 13:30h", "Entre las 18:45 y las 19:15h"], "correct": 0, "dato": "En esa primera hora se concentra aproximadamente el 25% de todos los viajes de alcance."}, {"q": "En promedio, ¿cuántas personas viajan adentro de cada auto que entra al CUR?", "options": ["Entre 1 y 2 personas (casi siempre viaja sólo el conductor)", "Entre 2 y 3 personas", "Más de 3 personas"], "correct": 0, "dato": "Al ingresar al CUR, cada automóvil lleva en promedio 1,24 personas. Al salir, el valor es muy similar: 1,26 personas por auto."}, {"q": "¿Qué sucede cuando no existe un camino peatonal claramente definido?", "options": ["Las personas siempre siguen el recorrido más largo.", "La gente marca su propio camino pisando el césped o la tierra por el trayecto más corto.", "Las personas evitan pasar por esa zona."], "correct": 1, "dato": "Estos recorridos que aparecen espontáneamente se conocen como \"líneas de deseo\" y pueden servir para detectar dónde sería conveniente mejorar o formalizar un camino."}, {"q": "¿Qué sector del predio es agradable y concurrido, pero presenta roces continuos entre peatones, bicis y autos?", "options": ["Plaza Canadá", "Parada Segura", "Aulario"], "correct": 0, "dato": "A pesar de los conflictos detectados, el sector presenta un uso intensivo en horarios pico y un buen nivel de actividad social."}, {"q": "¿Qué falta de conducta vial se detecta frecuentemente entre los vehículos dentro del CUR?", "options": ["Se circula en contramano o por encima de la velocidad permitida.", "Se circula demasiado lento, trabando las entradas.", "Se generan demoras porque no hay lugares de estacionamiento."], "correct": 0, "dato": "También hay falta de señalización, o su poca visibilidad dificulta la lectura de los recorridos y las reglas de circulación dentro del CUR."}, {"q": "¿Qué mal uso se detectó en espacios verdes dentro del predio?", "options": ["Se usan como estacionamiento improvisado para autos.", "Se hicieron canchas de fútbol.", "Se usan como lugares de espera y descanso."], "correct": 0, "dato": null}, {"q": "¿Cuál es el ancho de vereda más angosto registrado en todo el CUR?", "options": ["0,80 m", "2,00 m", "1,30 m"], "correct": 0, "dato": "En el mismo sector hay tramos de hasta 4,90 m de ancho: más de 6 veces el pasaje más angosto."}, {"q": "Las baldosas podotáctiles tienen relieves que permiten orientar o advertir obstáculos a personas con discapacidad visual. ¿En cuántos puntos del CUR se encuentran?", "options": ["En casi todas las esquinas y rampas relevadas.", "En cerca de la mitad de los accesos.", "En un único punto del predio."], "correct": 2, "dato": "Se encontraron únicamente en la rampa del Aulario, mientras que en el resto de los puntos relevados no se registró este tipo de señalización."}, {"q": "¿Qué proporción de los tramos de vereda relevados tiene obstáculos que reducen el espacio disponible para caminar?", "options": ["Entre 10% y 20%", "Entre 20% y 30%", "Entre 30% y 40%"], "correct": 2, "dato": "El porcentaje exacto fue de 33%, es decir, aproximadamente 1 de cada 3 tramos."}, {"q": "¿Qué porcentaje de los carteles de tránsito dentro del predio no se ve bien o está tapado?", "options": ["Entre 10% y 20%", "Entre 20% y 30%", "Entre 30% y 40%"], "correct": 1, "dato": "El porcentaje exacto fue de 22% de las señales relevadas."}, {"q": "¿Qué proporción de los lugares donde se dejan autos funciona de manera informal o sin regular?", "options": ["Entre 20% y 30%", "Entre 30% y 40%", "Entre 40% y 50%"], "correct": 2, "dato": "La proporción fue de aproximadamente 1 de cada 2 zonas de estacionamiento."}, {"q": "¿Cuál es el principal modo de transporte que usa la gente para llegar al CUR?", "options": ["Colectivo (urbano o interurbano)", "Auto o moto particular", "Bicicleta"], "correct": 0, "dato": null}, {"q": "¿Cuánto tiempo tarda en llegar al CUR la mayoría de las personas que asisten en colectivo?", "options": ["Menos de 15 minutos", "Entre 15 minutos y 1 hora", "Más de 2 horas y media"], "correct": 1, "dato": "La mayor concentración se da entre 15 y 30 minutos, y entre 30 minutos y 1 hora de viaje."}, {"q": "¿En qué momento del día se da la mayor asistencia al CUR en bicicleta?", "options": ["Mañana", "Tarde", "Noche"], "correct": 1, "dato": "Por la tarde asiste el 44% de los ciclistas, por la mañana el 25% y por la noche el 31%."}, {"q": "De las personas que asisten y viven en Rosario, ¿cuál es el segundo distrito de donde viene más gente después del Centro?", "options": ["Distrito Norte", "Distrito Oeste", "Distrito Sudoeste"], "correct": 0, "dato": null}, {"q": "¿Qué porcentaje de las personas que asisten al CUR tienen alguna discapacidad que afecte su movilidad?", "options": ["Alrededor del 3,7%", "Cerca del 15%", "Más del 25%"], "correct": 0, "dato": null}, {"q": "¿Qué distancia recorre la gran mayoría de quienes asisten al CUR en vehículo particular desde su casa?", "options": ["Menos de 10 kilómetros", "Entre 10 y 20 kilómetros", "Más de 20 kilómetros"], "correct": 0, "dato": "El 68,6% de las personas que asisten en moto o auto particular recorren 10 km o menos para llegar al CUR."}, {"q": "¿Qué porcentaje de personas que asisten al CUR viven fuera de Rosario?", "options": ["Menos del 10%", "Alrededor del 20%", "Alrededor del 50%"], "correct": 1, "dato": "El 20,7% de las personas que asisten al CUR viven fuera de Rosario."}, {"q": "¿Cuál es el modo más utilizado por las personas que asisten al CUR que viven fuera de Rosario?", "options": ["Automóvil particular", "Colectivo", "Moto"], "correct": 1, "dato": "El 83,6% de las personas que viven fuera de Rosario asiste al CUR en colectivo."}]};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickRandom(list, n){
  return shuffle(list).slice(0, n);
}

function buildQuizSet(){
  const b1 = pickRandom(QUIZ_DATA.block1, 2);
  const b2 = pickRandom(QUIZ_DATA.block2, 4);
  const combined = [...b1, ...b2];
  // shuffle options within each question too
  return combined.map(item => {
    const optIdx = item.options.map((opt,i)=>({opt,i}));
    const shuffledOpts = shuffle(optIdx);
    return {
      q: item.q,
      dato: item.dato,
      options: shuffledOpts.map(o=>o.opt),
      correct: shuffledOpts.findIndex(o=>o.i === item.correct)
    };
  });
}

  const facultyInput = document.getElementById('regFaculty');

  document.getElementById('startBtn').addEventListener('click', () => {
    const name = nameInput.value.trim();
    const faculty = facultyInput.value.trim();
    if(!name || !faculty){
      regError = 'Por favor completá ambos campos para continuar.';
      participant.name = name;
      participant.faculty = faculty;
      renderRegistration();
      return;
    }
    participant.name = name;
    participant.faculty = faculty;
    regError = '';
    started = true;
    render();
  });
}

function render(){
  if(!started){
    renderRegistration();
    return;
  }
  if(current >= quiz.length){
    renderFinal();
    return;
  }
  const item = quiz[current];
  const isLast = current === quiz.length - 1;

  let optionsHTML = item.options.map((opt, i) => {
    let cls = 'option';
    if(answered){
      if(i === selectedIdx) cls += ' selected';
      else if(i === item.correct) cls += ' correct-hint';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-idx="${i}" ${answered ? 'disabled' : ''}>${opt}</button>`;
  }).join('');

  let feedbackHTML = '';
  if(answered){
    const ok = selectedIdx === item.correct;
    feedbackHTML = `<div class="feedback ${ok ? 'correct' : 'incorrect'}">${ok ? '¡Respuesta correcta!' : 'Respuesta incorrecta'}</div>`;
  }

  let factHTML = '';
  if(answered && item.dato){
    factHTML = `<div class="fact"><p class="label">¿SABÍAS QUE...?</p><p class="text">${item.dato}</p></div>`;
  }

  let nextBtnHTML = '';
  if(answered){
    nextBtnHTML = `<button class="next-btn" id="nextBtn">${isLast ? 'FINALIZAR' : 'SIGUIENTE PREGUNTA'}</button>`;
  }

  let imgHTML = '';
  if(item.img){
    imgHTML = `<img class="question-img" src="${item.img}" alt="">`;
  }

  app.innerHTML = `
    ${headerHTML()}
    <div class="progress">PREGUNTA ${current + 1} DE ${quiz.length}</div>
    <div class="card">
      <p class="eyebrow">Pregunta</p>
      <p class="question">${item.q}</p>
      ${imgHTML}
      <div class="options">${optionsHTML}</div>
    </div>
    ${feedbackHTML}
    ${factHTML}
    ${nextBtnHTML}
  `;

  if(!answered){
    app.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedIdx = parseInt(btn.dataset.idx, 10);
        answered = true;
        const ok = selectedIdx === item.correct;
        if(ok) score++;
        history.push({q: item.q, ok, correctText: item.options[item.correct], dato: item.dato});
        render();
      });
    });
  } else {
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.addEventListener('click', () => {
        current++;
        answered = false;
        selectedIdx = null;
        render();
      });
    }
  }
}

function renderFinal(){
  if(sendStatus === 'idle'){
    sendStatus = 'sending';
    sendToGoogleSheet().then(ok => {
      sendStatus = ok ? 'success' : 'error';
      renderFinal();
    });
  }

  const summaryHTML = history.map(h => `
    <div class="summary-item">
      <p class="q"><span class="mark ${h.ok ? 'ok' : 'bad'}">${h.ok ? '✓' : '✗'}</span> ${h.q}</p>
      <p class="ans">Respuesta correcta: ${h.correctText}</p>
      ${h.dato ? `<p class="dato">${h.dato}</p>` : ''}
    </div>
  `).join('');

  let statusHTML = '';
  if(sendStatus === 'sending'){
    statusHTML = `<div class="send-status sending">Enviando tus respuestas...</div>`;
  } else if(sendStatus === 'success'){
    statusHTML = `<div class="send-status success">✔ Tus respuestas fueron registradas.</div>`;
  } else if(sendStatus === 'error'){
    statusHTML = `<div class="send-status error"><p>No pudimos registrar tus respuestas.</p><button class="retry-btn" id="retryBtn">Reintentar envío</button></div>`;
  }

  app.innerHTML = `
    ${headerHTML()}
    <div class="final-card">
      <p class="final-label">PUNTAJE FINAL</p>
      <p class="final-score">${score}/${quiz.length}</p>
      <p class="summary-title">RESUMEN DE RESPUESTAS</p>
      <div class="summary-list">${summaryHTML}</div>
    </div>
    ${statusHTML}
    <button class="restart-btn" id="restartBtn">COMENZAR NUEVAMENTE</button>
    <div class="download-card">
      <p>SI QUERÉS SABER MÁS, PODÉS DESCARGARTE ACÁ EL ARCHIVO DEL ESTUDIO DE MOVILIDAD DEL CUR</p>
      <a href="https://drive.google.com/file/d/1tWLsGFFvLBMsD_QdWYuJfqIbhenXwFkP/view?usp=drive_link" id="downloadLink" target="_blank" rel="noopener noreferrer">Descargar resumen ejecutivo</a>
    </div>
  `;

  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn){
    retryBtn.addEventListener('click', () => {
      sendStatus = 'idle';
      renderFinal();
    });
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    quiz = buildQuizSet();
    current = 0;
    score = 0;
    answered = false;
    selectedIdx = null;
    history = [];
    started = false;
    participant = { name: '', faculty: '' };
    regError = '';
    sendStatus = 'idle';
    render();
  });
}

async function sendToGoogleSheet(){
  const detalle = history.map(h =>
    `${h.q} => ${h.ok ? 'Correcta' : 'Incorrecta'} (Respuesta correcta: ${h.correctText})`
  ).join(' | ');

  const payload = {
    nombre: participant.name,
    facultad: participant.faculty,
    puntaje: score,
    total: quiz.length,
    detalle: detalle
  };

  try{
    // Usamos 'no-cors' porque Google Apps Script no siempre devuelve los
    // headers CORS correctos en la respuesta (por la redirección interna
    // que hace). Con 'no-cors' no podemos leer la respuesta, pero la
    // petición SÍ llega al servidor y el doPost se ejecuta igual.
    // Si el fetch no lanza una excepción, asumimos que se envió con éxito.
    await fetch(GOOGLE_SHEET_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return true;
  }catch(err){
    console.error('No se pudo registrar en Google Sheets:', err);
    return false;
  }
}

render();
</script>
